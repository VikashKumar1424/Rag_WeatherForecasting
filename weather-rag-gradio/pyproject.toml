
[project]
name = "weather-rag-gradio"
version = "0.1.0"
description = "RAG-based weather monitoring application using Open-Meteo, Gemini 3.5 Flash, Gemini Embedding 2, LangChain, Chroma and Gradio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13.5",
  "chromadb>=1.0.20",
  "gradio>=6.0.0",
  "google-genai>=1.32.0",
  "langchain>=0.3.27",
  "langchain-chroma>=0.2.5",
  "langchain-google-genai>=2.1.12",
  "langchain-text-splitters>=0.3.9",
  "python-dotenv>=1.1.1",
  "requests>=2.32.5",
  "pydantic>=2.11.7",
  "pytest>=8.4.2",
  "jupyter>=1.1.1",
  "ipykernel>=6.30.1",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.4",
  "apscheduler>=3.11.3",
  "pandas>=3.0.5",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]

[project.scripts]
weather-rag = "weather_rag.app:main"
